<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#79c4f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>캐논 포격전 - Canon Battle</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- ===== 타이틀 화면 ===== -->
  <div id="titleScreen" class="screen">
    <div class="logo-wrap">
      <h1 class="logo">캐논 <span>배틀</span></h1>
      <p class="tagline">포트리스 스타일 · 턴제 포격전</p>
    </div>
    <div class="menu">
      <button class="big-btn" id="btn1p">🤖 혼자 하기 (vs AI)</button>
      <button class="big-btn" id="btn2p">👥 둘이 하기 (한 기기)</button>
    </div>
    <p class="hint">각도와 파워, 바람을 계산해 상대 탱크를 격파하세요!</p>
  </div>

  <!-- ===== 탱크 선택 화면 ===== -->
  <div id="selectScreen" class="screen hidden">
    <h2 id="selectTitle">탱크 선택</h2>
    <div class="tank-cards" id="tankCards"></div>
    <button class="big-btn" id="btnStart" disabled>출격!</button>
  </div>

  <!-- ===== 인게임 상단 HUD ===== -->
  <div id="hud" class="hidden">
    <div class="hp-panel" id="hpP1">
      <div class="pname">P1</div>
      <div class="hpbar"><div class="hpfill"></div></div>
    </div>
    <div id="windBox">
      <div id="windArrow">▶</div>
      <div id="windVal">0</div>
      <div id="turnTimer">30</div>
    </div>
    <div class="hp-panel right" id="hpP2">
      <div class="pname">P2</div>
      <div class="hpbar"><div class="hpfill"></div></div>
    </div>
  </div>

  <!-- ===== 인게임 하단 컨트롤 ===== -->
  <div id="controls" class="hidden">
    <div class="ctl-group move-group">
      <button class="ctl-btn" id="btnLeft">◀</button>
      <button class="ctl-btn" id="btnRight">▶</button>
      <div class="mini-gauge"><div id="fuelFill"></div></div>
    </div>
    <div class="ctl-group angle-group">
      <button class="ctl-btn" id="btnAngUp">▲</button>
      <div id="angleVal">45°</div>
      <button class="ctl-btn" id="btnAngDown">▼</button>
    </div>
    <div class="ctl-group fire-group">
      <button class="ctl-btn small" id="btnWeapon">일반탄</button>
      <button id="btnFire">발사<div id="powerBar"><div id="powerFill"></div></div></button>
    </div>
  </div>

  <div id="banner" class="hidden"></div>

  <!-- ===== 게임오버 ===== -->
  <div id="overScreen" class="screen hidden">
    <h2 id="overTitle">승리!</h2>
    <button class="big-btn" id="btnAgain">한 판 더</button>
    <button class="big-btn ghost" id="btnMenu">메인 메뉴</button>
  </div>

  <button id="btnMute" class="hidden">🔊</button>
</div>
<script src="js/main.js"></script>
</body>
</html>
